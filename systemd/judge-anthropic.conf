# Drop-in for the units that call the LLM judge, rendered by install/linux-authority.sh to
# ~/.config/systemd/user/<unit>.d/judge-anthropic.conf when the judge provider is the Claude API
# (--judge-provider anthropic; docs/systems/judge-provider.md). It adds the API key as one more
# systemd credential. mem0-server/anthropic_judge.py reads it from $CREDENTIALS_DIRECTORY at call
# time; the key is never an Environment= value, so no child process inherits it.
[Service]
LoadCredentialEncrypted=ams-anthropic-key:__SECRETS_DIR__/ams-anthropic-key.cred
