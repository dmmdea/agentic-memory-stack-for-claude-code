# Native-authority drop-in for l10-audit.service (rendered by install/linux-authority.sh to
# ~/.config/systemd/user/l10-audit.service.d/native.conf). The audit runs on its own timer
# outside the chain, so it loads the API key itself: there is no ~/.mem0/api-key on a native box
# (the first v1.22.0 run exited 1 with "no mem0 API key").
[Service]
LoadCredentialEncrypted=ams-api-key:__SECRETS_DIR__/ams-api-key.cred
Environment=MEM0_API_KEY_FILE=%d/ams-api-key
Environment=MEM0_HOST_KIND=native
