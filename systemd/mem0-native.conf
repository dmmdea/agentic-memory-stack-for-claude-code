# Native-authority drop-in for mem0.service (spec §4). Rendered by install/linux-authority.sh to
# ~/.config/systemd/user/mem0.service.d/native.conf. The base unit is shared with the WSL install;
# this file removes its DPAPI ExecStartPre and adds the systemd-creds key delivery and the bind wait.
# %d = $CREDENTIALS_DIRECTORY (systemd >= 250); the .cred files were made with
# `systemd-creds --user encrypt --with-key=host+tpm2` on this box and decrypt nowhere else.
[Service]
ExecStartPre=
ExecStartPre=%h/apps/mem0-scripts/wait-for-bind.sh __MEM0_BIND__ 120
LoadCredentialEncrypted=ams-canonical-key:__SECRETS_DIR__/ams-canonical-key.cred
LoadCredentialEncrypted=ams-api-key:__SECRETS_DIR__/ams-api-key.cred
Environment=MEM0_API_KEY_FILE=%d/ams-api-key
Environment=MEM0_HOST_KIND=native
Environment=MEM0_CODEX_TRANSPORT=native
Environment=MEM0_ZFS_DATASET=__ZFS_DATASET__
# Codex auth.json lives in the secrets dataset (spec §4), never in ~/.codex: the native judge
# transport and every codex-calling chain step must see the same login.
Environment=CODEX_HOME=__SECRETS_DIR__/codex
# The llama-swap model the store's vectors were made with (the installer's --embed-model).
Environment=MEM0_EMBED_MODEL=__EMBED_MODEL__
