name: CI

# Every job below is blocking and green on the tree it was added to.
#
# The three linters start at their *error* tier on purpose. The tree has
# pre-existing findings at the lower tiers, and a repo-wide cleanup does not
# belong in the commit that introduces CI. Each tier is a ratchet: a follow-up PR
# cleans one level, then raises the gate here. Measured on 73ac638:
#
#   ruff              E701/E702 (29, need a formatter), E402 (9, several are
#                     load-bearing sys.path patches), E722 (2, changes behavior)
#   shellcheck        --severity=warning: 2 findings
#   PSScriptAnalyzer  -Severity Warning: 322 findings
#
# Nothing is silenced: the deferred tiers are listed above so raising them is a
# decision, not a discovery.

# Branch flow: feature -> dev -> main. Both protected branches are gated: CI runs
# on every PR into dev or main, and again on the merge result.
on:
  push:
    branches: [main, dev]
    # P4-1a (2026-09-16): a pushed release tag runs ONLY the release-assets job at the bottom;
    # every other job carries `if: github.ref_type != 'tag'`, because the tree a tag points at
    # already passed this matrix on main.
    tags: ['v*']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-closure:
    name: Installer import closure
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every mem0-server module is shipped by the installer
        run: bash scripts/ci/check-import-closure.sh

  tests:
    name: Python tests (public suites)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # httpx is imported at module scope by ship_log_reclassify; fastapi by the
      # server modules some suites import (security_invariants, app handlers);
      # fastmcp by the MCP-shim contract tests (they skip wholesale without it).
      - name: Install test dependencies
        # jsonschema is the authority's own validator: dream-consolidate.py validates the
        # nightly judge plan against docs/schemas/judge-plan.schema.json before writing it,
        # and test_judge_plan_schema.py holds that schema to the same corpus the Go decoder
        # test runs. Without it here the schema side would importorskip in CI - a test that
        # never runs is not a gate.
        run: python -m pip install --disable-pip-version-check --quiet pytest httpx fastapi fastmcp jsonschema
      # The explicit list below is the HEADLESS subset: every file runs green on a
      # clean runner with no live stack (no Qdrant/mem0/llama-swap/Codex). The
      # remaining files in mem0-server/tests are the live-stack suites — they ship
      # for operators to run against a real deployment and are deliberately not
      # collected here (unguarded HTTP to :18791/:6333, or `import app` which
      # builds the live Memory client at import time). test_egemma_embedder needs
      # the heavy `mem0` package and runs locally only.
      - name: Run the suites that need no live stack
        run: |
          python -m pytest -q \
            mem0-server/tests/test_admission_gate.py \
            mem0-server/tests/test_ams01_history_window.py \
            mem0-server/tests/test_ams57_counts.py \
            mem0-server/tests/test_autopromote_actor.py \
            mem0-server/tests/test_canonical_key_provider.py \
            mem0-server/tests/test_capabilities.py \
            mem0-server/tests/test_codex_shim_client.py \
            mem0-server/tests/test_config_import_closure.py \
            mem0-server/tests/test_contradiction_resolve.py \
            mem0-server/tests/test_contradiction_sweep.py \
            mem0-server/tests/test_dpapi_fetch_key.py \
            mem0-server/tests/test_egemma_rollback_prune.py \
            mem0-server/tests/test_episodic_reconcile.py \
            mem0-server/tests/test_failure_injection.py \
            mem0-server/tests/test_freshness.py \
            mem0-server/tests/test_goal_redesign.py \
            mem0-server/tests/test_job_liveness.py \
            mem0-server/tests/test_l10_audit.py \
            mem0-server/tests/test_ledger_audit.py \
            mem0-server/tests/test_mcp_shim_contract.py \
            mem0-server/tests/test_mojibake_check.py \
            mem0-server/tests/test_nli_write_gate.py \
            mem0-server/tests/test_open_questions.py \
            mem0-server/tests/test_payload_carryover.py \
            mem0-server/tests/test_phase2a_canary.py \
            mem0-server/tests/test_r2_injection_gating.py \
            mem0-server/tests/test_redact.py \
            mem0-server/tests/test_replay_ops.py \
            mem0-server/tests/test_jobs_queue.py \
            mem0-server/tests/test_pair_cache.py \
            mem0-server/tests/test_reranker.py \
            mem0-server/tests/test_shim_offline.py \
            mem0-server/tests/test_sparse_health.py \
            mem0-server/tests/test_systemd_parity.py \
            mem0-server/tests/test_tier_parity.py \
            mem0-server/tests/test_w7_outbox_drain.py \
            mem0-server/tests/test_canonize_forwarding.py \
            mem0-server/tests/test_sessionstart_bundle_authority.py \
            mem0-server/tests/test_storage_cap_authority.py \
            mem0-server/tests/test_loopback_probe_pins.py \
            mem0-server/tests/test_dream_consolidate.py \
            mem0-server/tests/test_judge_plan_schema.py \
            mem0-server/tests/test_linux_authority_installer.py \
            mem0-server/tests/test_linux_client_store.py \
            mem0-server/tests/test_linux_client_installer.py \
            mem0-server/tests/test_linux_replica.py \
            mem0-server/tests/test_w7_server_smalls.py \
            claude-config/tests \
            scripts/wsl/test_ship_log_classifier.py \
            scripts/wsl/test_ship_log_reclassify.py

  docs-gate:
    name: Docs gate (links, operator-neutral, ADR frontmatter)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check docs
        run: python scripts/ci/check-docs.py

  pester:
    name: Pester (Windows product suites)
    if: github.ref_type != 'tag'
    # The Windows-side product tests: hook libs, installer parity, daemon/client,
    # gates. They sandbox via TestDrive/fake USERPROFILE, mock HTTP, and use only
    # what a stock runner ships (powershell.exe 5.1 for child-process tests, .NET
    # Framework csc for the compiled-client build test). Environment-dependent
    # Describes self-skip on a runner (no deployed stack present).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester 5
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.0 -Force -Scope CurrentUser -SkipPublisherCheck -ErrorAction Stop
      - name: Run the Windows product suites
        shell: pwsh
        run: |
          $r = Invoke-Pester scripts/windows/tests -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { throw "Pester: $($r.FailedCount) failed" }

  ruff:
    name: ruff (pyflakes tier)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check --quiet ruff
      # Full pyflakes: real bugs (undefined names, redefinitions) plus dead code
      # (unused imports and variables). Green since the dead code was removed.
      - name: Lint
        run: ruff check --select F --output-format=github .

  shellcheck:
    name: shellcheck (error tier)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck ships preinstalled on the GitHub-hosted ubuntu runners.
      - name: Lint shell scripts
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          printf 'checking %d shell script(s)\n' "${#files[@]}"
          shellcheck --severity=error "${files[@]}"

  psscriptanalyzer:
    name: PSScriptAnalyzer (error tier)
    if: github.ref_type != 'tag'
    # PSScriptAnalyzer parses the AST — it never executes the scripts — so it runs
    # on Linux via cross-platform pwsh (preinstalled on the ubuntu runners). Keeps
    # the matrix on one OS and off the 2x-cost Windows runners.
    # Note: the module requires pwsh >= 7.4.6.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
      - name: Analyze PowerShell scripts
        shell: pwsh
        run: |
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($findings) {
            $findings | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            throw "PSScriptAnalyzer reported $($findings.Count) error-severity finding(s)"
          }
          Write-Host 'PSScriptAnalyzer: no error-severity findings.'

  ams-store-go-linux:
    name: ams-store (Go, linux)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ams-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: git version (merge-tree --write-tree needs >= 2.38)
        run: git --version
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -count=1

  ams-store-go-windows:
    name: ams-store (Go, windows)
    if: github.ref_type != 'tag'
    # windows-latest bills 2x, but this repo is PUBLIC so Actions minutes are free.
    # Kept to build + test (no -race, which needs a C toolchain) so the Windows
    # reparse/path code is exercised without the race-detector dependency.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ams-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go build ./...
      - run: go test ./... -count=1

  release-assets:
    name: ams-store release assets (tag v<VERSION> only)
    # P4-1a (2026-09-16, blueprint §12.2-12.5): the store binary is never built on a PC and never
    # committed. Pushing the tag `v<VERSION>` runs this one ubuntu job: it cross-compiles the
    # client for every install target with the README's ldflags (version = the tag, so
    # `ams-store --version` on a PC says exactly what the installer expected), writes SHA256SUMS
    # over the assets and attaches all of it to the GitHub release for the tag.
    # install/2-windows-config.ps1 downloads the Windows asset for the tag VERSION names and
    # verifies it against SHA256SUMS before it registers a single hook; the Linux installers take
    # the linux assets the same way. One Linux job of roughly a minute per release, inside the
    # included minutes; no Windows runner here on purpose (2x minutes) - the Windows binary is a
    # cross-compile. The tag must equal `v` + VERSION at that commit: a release whose asset says
    # one version while the repo says another is exactly the skew the installer's checks exist
    # to catch, so it is refused before anything is built.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ams-store
    steps:
      - uses: actions/checkout@v4
      - name: The tag names the VERSION file
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(tr -d '[:space:]' < ../VERSION)"
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match VERSION ($version): tag v$version, or bump VERSION first"
            exit 1
          fi
          echo "releasing ams-store $tag"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ams-store/go.sum
      - name: Cross-compile every install target (CGO_ENABLED=0, static)
        run: |
          set -euo pipefail
          mkdir -p dist
          commit="$(git rev-parse --short HEAD)"
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${commit} -X main.built=${built}"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o dist/ams-store-windows-amd64.exe ./cmd/ams-store
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o dist/ams-store-linux-amd64   ./cmd/ams-store
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags "$ldflags" -o dist/ams-store-linux-arm64   ./cmd/ams-store
          (cd dist && sha256sum ams-store-windows-amd64.exe ams-store-linux-amd64 ams-store-linux-arm64 > SHA256SUMS && cat SHA256SUMS)
      - name: The linux/amd64 asset answers --version with the tag
        run: |
          out="$(./dist/ams-store-linux-amd64 --version)"
          echo "$out"
          case "$out" in
            "ams-store ${GITHUB_REF_NAME} "*) ;;
            *) echo "::error::--version does not carry the tag ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
      - name: Create the GitHub release with the assets attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-from-tag \
            dist/ams-store-windows-amd64.exe \
            dist/ams-store-linux-amd64 \
            dist/ams-store-linux-arm64 \
            dist/SHA256SUMS
